<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Project Editor</title><style>*{box-sizing:border-box}body{margin:0;background:#0e0e20;color:#eee;font:15px system-ui}main{max-width:1200px;margin:auto;padding:24px}h1{margin-bottom:5px}p{color:#bcb6d1}button,input,select{font:inherit;color:inherit;border:1px solid #51436d;border-radius:8px;background:#1b1930;padding:10px}button{cursor:pointer}button.primary{background:#7927e8;border:0}label{display:grid;gap:6px;margin:12px 0}input,select{width:100%}.layout{display:grid;grid-template-columns:340px 1fr;gap:20px}section{background:#151428;border:1px solid #38304e;border-radius:14px;padding:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #38304e}.item img,#preview{width:64px;height:64px;object-fit:contain;border-radius:10px;background:#24203a}.item div{flex:1;min-width:0}.item small{display:block;color:#bcb6d1}.danger{color:#ff9aab}@media(max-width:750px){.layout{grid-template-columns:1fr}.item{flex-wrap:wrap}}</style><main><h1>Project Editor</h1><p>Mukhshaf Tariq · Manage your portfolio projects</p><div class="toolbar"><button class="primary" id="export">Download projects.js</button><button id="reset">Reset draft</button><a href="index.html" style="color:#cda5ff">Open portfolio ↗</a></div><p id="status" role="status">Changes are saved as a local draft. Export projects.js and replace it on GitHub to publish.</p><div class="layout"><section><h2 id="heading">Add project</h2><form id="form"><label>Project name<input id="title" required></label><label>Developer account<select id="account"><option value="0">Game Broz</option><option value="1">ERIC GAMES LTD</option><option value="2">PlayZa Games</option><option value="3">Other</option></select></label><label>Category<input id="category" required></label><label>Project / Google Play URL<input id="url" type="url" required></label><label>Logo URL<input id="image" placeholder="https://..."></label><label>Or upload logo<input id="upload" type="file" accept="image/png,image/jpeg,image/webp"></label><img id="preview" alt="Logo preview"><div class="toolbar"><button class="primary">Save project</button><button type="button" id="cancel">Clear</button></div></form></section><section><h2>Projects <span id="count"></span></h2><input id="search" placeholder="Search projects"><div id="list"></div></section></div></main><script src="projects.js"></script><script src="editor.js"></script></html>
